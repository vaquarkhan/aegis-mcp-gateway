# Template for any Apache project (or any REST/MCP backend). Copy, rename, fill in.
# Every key is documented in docs/CONFIGURATION.md. Unknown keys stop startup, so typos cannot
# silently disable a control.
sources:
  - id: flink_backend
    type: http
    baseUrl: http://localhost:8083
    tools:
      - name: run_sql_readonly
        description: "Execute read-only SQL queries against the Flink backend."
        class: READ

      - name: run_sql
        description: "Execute SQL statements that modify data or database objects."
        class: MUTATE

      - name: execute_statement
        description: "Execute a generic SQL statement against the Flink backend."
        class: MUTATE


