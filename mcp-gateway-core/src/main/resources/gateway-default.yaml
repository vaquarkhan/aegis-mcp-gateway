# Author: Viquar Khan
#
# Sample gateway.yaml. Point MCP_GW_CONFIG at a copy of this file.
# Environment variables always override anything set here.
# Secrets are never read from this file: MCP_GW_APPROVAL_SECRET,
# MCP_GW_HTTP_BEARER_TOKEN and MCP_GW_HTTP_TLS_KEYSTORE_PASSWORD are
# environment only, so a mounted config map cannot leak them.

gateway:
  transport: stdio          # stdio | http
  logLevel: INFO

http:
  host: 127.0.0.1
  port: 8090
  tls:
    enabled: false
    keystore: /etc/aegis/server.p12
    keystoreType: PKCS12

auth:
  mode: tokenfile           # oauth | cimd | spiffe | tokenfile
  tokensFile: /etc/aegis/auth-tokens.txt
  oauth:
    issuer: ""
    audience: ""
    jwksUrl: ""
    requiredScope: ""
  cimd:
    metadataUrl: ""
  spiffe:
    trustDomain: ""
    socket: ""              # MCP_GW_SPIFFE_SOCKET, workloadApi is the older name

authz:
  pdp: builtin              # builtin | cedar | opa
  policyFile: ""

governance:
  writeEnabled: false
  approvalTtlMs: 300000
  rps: 5
  breakerFailures: 5
  breakerResetMs: 30000
  toolTimeoutMs: 30000
  maxBytes: 65536
  maxSqlChars: 32768
  dlpEnabled: true
  promptInjectionEnabled: true
  vrpEnabled: true
  vrpReceiptTtlMs: 900000
  readonlyCaller: false
  shutdownTimeoutMs: 15000
  resourceScopes:
    - "*"
  egressAllowHosts: []
  jarUploadAllowDirs: []

finops:
  tokenBudgetDaily: 0       # 0 disables metering
  semanticCacheTtlMs: 0     # 0 disables the read cache

adapters:
  enabled: []               # empty means every discovered adapter

tools:
  allowed: []               # empty means every aggregated tool of an allowed class
  catalogFile: ""           # optional tools.yaml overlay
