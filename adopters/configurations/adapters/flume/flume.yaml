# Apache Flume: governed MCP tools over the Apache Flume HTTP API, configuration only.
# The Flume agent JSON metrics endpoint: GET /metrics, GET /.
# Read-only by design: a Flume agent has no write surface here.
# Replaces the Aegis 0.1 Java adapter mcp-adapter-flume (taxonomy: ingest).
# Dry run defaults to GATEWAY (governance preflight only); tools that can validate against the
# exact target use dryRun mode TOOL with that read as the preview.

gateway:
  name: aegis-flume

access:
  writeGroups: [flume-operators]
  approverGroups: [flume-approvers]

approval:
  keyEnv: AEGIS_SIGNING_KEY          # >= 32 bytes; shared by every replica

policy:
  rules:
    - {id: read, groups: [flume-users, flume-operators], classes: [READ]}
    - {id: operate, groups: [flume-operators], classes: [MUTATE, DESTRUCTIVE]}

rateLimits:
  perCallerPerMinute: 120
  budgetPerHour: 2000

egress:
  allowCidrs: [10.0.0.0/8]           # your cluster network; the baseUrl host is allowed automatically

audit:
  file: audit/aegis-flume.jsonl

sources:
  - id: flume
    type: http
    baseUrl: http://flume-agent:41414
    tools:
      - name: flume_get_metrics
        description: "Channel, source and sink counters for this agent."
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: "/metrics"}

      - name: flume_get_health
        description: "Agent root, used as a liveness read."
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: "/"}
