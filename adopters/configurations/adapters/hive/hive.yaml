# Generated by Aegis ConfigComposer
# effectiveConfigHash: sha256:f551d88bf876222d8e304c706159c8e55050d2df8a5b7014d5146e01e25141fa
access:
  approverGroups:
  - hive-approvers
  writeGroups:
  - hive-operators
approval:
  keyEnv: AEGIS_SIGNING_KEY
audit:
  file: audit/aegis-hive.jsonl
egress:
  allowCidrs:
  - 10.0.0.0/8
gateway:
  name: aegis-hive
hooks:
- methods:
  - jdbc_run_query
  mode: ENFORCE
  operations:
  - TOOL_CALL
  settings:
    arguments:
    - sql
    maxChars: 8192
  type: sql-readonly
  sources:
  - hive
policy:
  rules:
  - classes:
    - READ
    groups:
    - hive-users
    - hive-operators
    id: read
  - classes:
    - MUTATE
    - DESTRUCTIVE
    groups:
    - hive-operators
    id: operate
rateLimits:
  budgetPerHour: 500
  perCallerPerMinute: 60
sources:
- id: hive
  settings:
    allowWrites: false
    driverClass: org.apache.hive.jdbc.HiveDriver
    loginTimeoutSeconds: 15
    maxCellChars: 4096
    maxRows: 200
    passwordEnv: HIVE_PASSWORD
    url: jdbc:hive2://hiveserver2:10000/default
    userEnv: HIVE_USER
  tools:
    jdbc_describe_table:
      class: READ
      resources:
      - pointer: /table
        type: hive:table
    jdbc_list_catalogs:
      class: READ
    jdbc_list_schemas:
      class: READ
    jdbc_list_tables:
      class: READ
      resources:
      - pointer: /schema
        required: false
        type: hive:schema
    jdbc_run_query:
      class: READ
    jdbc_server_info:
      class: READ
  type: jdbc
