# Apache Superset: governed MCP tools over the Apache Superset HTTP API, configuration only.
# Superset REST API: GET /api/v1/database/, /api/v1/dataset/, /api/v1/chart/,
# DELETE /api/v1/chart/{id}.
# Replaces the Aegis 0.1 Java adapter mcp-adapter-superset (taxonomy: bi).
# Dry run defaults to GATEWAY (governance preflight only); tools that can validate against the
# exact target use dryRun mode TOOL with that read as the preview.

gateway:
  name: aegis-superset

access:
  writeGroups: [superset-operators]
  approverGroups: [superset-approvers]

approval:
  keyEnv: AEGIS_SIGNING_KEY          # >= 32 bytes; shared by every replica

policy:
  rules:
    - {id: read, groups: [superset-users, superset-operators], classes: [READ]}
    - {id: operate, groups: [superset-operators], classes: [MUTATE, DESTRUCTIVE]}

rateLimits:
  perCallerPerMinute: 120
  budgetPerHour: 2000

egress:
  allowCidrs: [10.0.0.0/8]           # your cluster network; the baseUrl host is allowed automatically

audit:
  file: audit/aegis-superset.jsonl

sources:
  - id: superset
    type: http
    baseUrl: http://superset:8088
    # Superset REST needs a JWT from POST /api/v1/security/login; the gateway holds that bearer.
    credentials: {type: bearer, tokenEnv: SUPERSET_ACCESS_TOKEN}
    tools:
      - name: superset_list_databases
        description: "List database connections."
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: "/api/v1/database/"}

      - name: superset_list_datasets
        description: "List datasets."
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: "/api/v1/dataset/"}

      - name: superset_list_charts
        description: "List charts."
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: "/api/v1/chart/"}

      - name: superset_get_chart
        description: "Get one chart by id (dry-run preview for delete)."
        class: READ
        inputSchema:
          type: object
          properties: {chartId: {type: string, maxLength: 200}}
          required: [chartId]
          additionalProperties: false
        request: {method: GET, path: "/api/v1/chart/{chartId}"}
        resources: [{type: "superset:chart", pointer: /chartId}]

      - name: superset_delete_chart
        description: "Delete one chart."
        class: DESTRUCTIVE
        inputSchema:
          type: object
          properties: {chartId: {type: string, maxLength: 200}}
          required: [chartId]
          additionalProperties: false
        request: {method: DELETE, path: "/api/v1/chart/{chartId}"}
        resources: [{type: "superset:chart", pointer: /chartId}]
        dryRun: {mode: TOOL, previewTool: superset_get_chart}
