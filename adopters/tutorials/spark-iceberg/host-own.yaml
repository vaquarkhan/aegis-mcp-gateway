# The own-host flavor only: who the callers are. start-gateway.* appends this to aegis-spark-iceberg.yaml.
# Development identities: static tokens read from environment variables (at least 16 characters each).
host:
  listen: {host: 127.0.0.1, port: 8080}
  identity:
    type: static
    static:
      tokens:
        - {tokenEnv: READER_TOKEN, actor: ana, groups: [lake-readers]}
        - {tokenEnv: ENGINEER_TOKEN, actor: eve, groups: [lake-engineers]}
        - {tokenEnv: APPROVER_TOKEN, actor: bob, groups: [lake-approvers]}
  # Used by --stdio, for IDEs that launch MCP servers as a local process.
  stdio: {actor: ana, groups: [lake-readers]}
