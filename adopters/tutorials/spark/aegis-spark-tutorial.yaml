#
# Tutorial configuration (docs/TUTORIAL-SPARK-AND-SPARK-CONNECT.md). One local Spark Connect server
# gives us both halves: its driver UI on :4040 serves the Spark monitoring REST API (classic Spark,
# governed as an http source) and :15002 is Spark Connect (governed by the spark-connect source).
# Development identities are static tokens read from environment variables. Everything binds to
# 127.0.0.1. Do not reuse this file in production (use JWT identity and TLS there).
gateway:
  name: aegis-spark-tutorial

access:
  writeGroups: [spark-operators]
  approverGroups: [spark-approvers]

approval:
  keyEnv: AEGIS_SIGNING_KEY

policy:
  rules:
    - {id: read, groups: [spark-users, spark-operators], classes: [READ]}
    - {id: operate, groups: [spark-operators], classes: [DESTRUCTIVE], tools: [spark_sql, spark_drop_table]}
    - {id: no-prod-drop, effect: DENY, groups: ["*"], tools: [spark_drop_table], resources: ["spark:table:prod.*"]}

egress:
  allowHosts: [127.0.0.1]
  allowCidrs: [127.0.0.0/8]
  schemes: [http]

audit:
  file: work/audit/aegis-spark-tutorial.jsonl

sources:
  # Classic Spark: the monitoring REST API of a running driver (any Spark application's UI, or a History Server).
  - id: spark-ui
    type: http
    baseUrl: http://127.0.0.1:4040
    tools:
      - name: spark_list_applications
        description: List the Spark applications this driver UI knows about.
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: /api/v1/applications}
      - name: spark_list_jobs
        description: List jobs of one Spark application.
        class: READ
        inputSchema:
          type: object
          properties: {appId: {type: string, maxLength: 128}}
          required: [appId]
          additionalProperties: false
        request: {method: GET, path: "/api/v1/applications/{appId}/jobs"}
        resources: [{type: "spark:app", pointer: /appId}]

  # Spark Connect: the gateway is a Spark Connect client; Spark runs in its own process.
  - id: spark-connect
    type: spark-connect
    unlistedTools: HIDE
    settings: {host: 127.0.0.1, port: 15002, maxRows: 50}
    tools:
      spark_list_databases: {class: READ}
      spark_list_tables: {class: READ}
      spark_describe_table: {class: READ, resources: [{type: "spark:table", pointer: /table}]}
      spark_preview_table: {class: READ, resources: [{type: "spark:table", pointer: /table}]}
      spark_explain_sql: {class: READ}
      spark_sql:
        class: DESTRUCTIVE
        dryRun: {mode: TOOL, previewTool: spark_explain_sql}
      spark_drop_table:
        class: DESTRUCTIVE
        resources: [{type: "spark:table", pointer: /table}]
        dryRun: {mode: TOOL, previewTool: spark_describe_table}

host:
  listen: {host: 127.0.0.1, port: 8080}
  identity:
    type: static
    static:
      tokens:
        - {tokenEnv: ANALYST_TOKEN, actor: ana, groups: [spark-users]}
        - {tokenEnv: OPERATOR_TOKEN, actor: oscar, groups: [spark-users, spark-operators]}
        - {tokenEnv: APPROVER_TOKEN, actor: bob, groups: [spark-approvers]}
  stdio: {actor: ana, groups: [spark-users]}
