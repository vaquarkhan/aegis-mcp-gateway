# Tutorial configuration (docs/TUTORIAL-FLINK.md). One source: the Flink JobManager REST API on
# 127.0.0.1:18081, reached as plain HTTP. No Java and no plugin are needed, which is the point:
# Flink's whole control plane is already an HTTP API, so governing it is a configuration exercise.
#
# This file is adopters/configurations/flink/flink.yaml with four tutorial-local changes:
#   1. baseUrl and egress point at a local cluster instead of a cluster network.
#   2. Identities are static tokens from environment variables instead of JWT.
#   3. flink_get_flink_config carries allowedGroups, so it is not even listed to an analyst.
#   4. The approved-jar pattern is spelled for real Flink jar ids (see run-approved-jars).
# Do not reuse this file in production: use JWT identity and TLS there.
gateway:
  name: aegis-flink-tutorial

access:
  writeGroups: [flink-operators]
  approverGroups: [flink-approvers]

approval:
  keyEnv: AEGIS_SIGNING_KEY

policy:
  rules:
    - {id: read-jobs, groups: [flink-users, flink-operators], classes: [READ]}
    - {id: operate-jobs, groups: [flink-operators], classes: [MUTATE, DESTRUCTIVE], resources: ["flink:job:*"]}
    # Running a jar on a Flink cluster is remote code execution by design, so the jar is a governed
    # resource and an operator allow-lists which jars may run at all.
    #
    # The pattern has to match what Flink actually calls a jar. The JobManager stores an upload as
    # "<uuid>_<original file name>" and that whole string is the jar id used by POST /jars/:jarid/run.
    # A real id looks like:
    #     cfd20846-f069-4572-b76d-33aa68320184_approved-StateMachineExample.jar
    # so a prefix pattern such as "flink:jar:approved-*" can never match an uploaded jar. The
    # convention this deployment uses is a file name beginning with "approved-", and the pattern
    # tolerates the uuid Flink puts in front of it.
    - {id: run-approved-jars, groups: [flink-operators], classes: [DESTRUCTIVE], tools: [flink_run_jar],
       resources: ["flink:jar:*_approved-*.jar"]}

rateLimits:
  perCallerPerMinute: 600
  budgetPerHour: 5000

egress:
  allowHosts: [127.0.0.1]
  allowCidrs: [127.0.0.0/8]
  schemes: [http]

audit:
  file: work/audit/aegis-flink-tutorial.jsonl

sources:
  - id: flink
    type: http
    baseUrl: http://127.0.0.1:18081
    tools:
      # ---------------------------------------------------------------- cluster reads
      - name: flink_get_cluster_info
        description: "Cluster overview: Flink version, slots total and available, running jobs."
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: /overview}

      - name: flink_list_taskmanagers
        description: List TaskManagers with their slot and resource counts.
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: /taskmanagers}

      - name: flink_get_flink_config
        description: Effective JobManager configuration.
        class: READ
        # Tutorial-local: the effective configuration of a real cluster carries credentials
        # (s3.access-key, a Kafka SASL JAAS string, a schema-registry password). A READ tool is still
        # a disclosure, so this one is listed only to operators. An analyst does not see it in
        # tools/list at all, and calling it anyway comes back NOT_EXPOSED.
        allowedGroups: [flink-operators]
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: /jobmanager/config}

      - name: flink_list_jars
        description: List jars uploaded to this JobManager.
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: /jars}

      # ---------------------------------------------------------------- job reads
      - name: flink_list_jobs
        description: List Flink jobs with their state.
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: /jobs/overview}
        response: {pointer: /jobs}

      - name: flink_get_job
        description: Details of one Flink job.
        class: READ
        inputSchema:
          type: object
          properties: {jobId: {type: string, minLength: 32, maxLength: 32}}
          required: [jobId]
          additionalProperties: false
        request: {method: GET, path: "/jobs/{jobId}"}
        resources: [{type: "flink:job", pointer: /jobId}]

      - name: flink_get_job_status
        description: State of one job only, without the vertex detail.
        class: READ
        inputSchema:
          type: object
          properties: {jobId: {type: string, minLength: 32, maxLength: 32}}
          required: [jobId]
          additionalProperties: false
        request: {method: GET, path: "/jobs/{jobId}"}
        response: {pointer: /state}
        resources: [{type: "flink:job", pointer: /jobId}]

      - name: flink_get_job_exceptions
        description: Exception history of one job, most recent first.
        class: READ
        inputSchema:
          type: object
          properties: {jobId: {type: string, minLength: 32, maxLength: 32}}
          required: [jobId]
          additionalProperties: false
        request: {method: GET, path: "/jobs/{jobId}/exceptions"}
        resources: [{type: "flink:job", pointer: /jobId}]

      - name: flink_get_job_metrics
        description: Metrics of one job.
        class: READ
        inputSchema:
          type: object
          properties: {jobId: {type: string, minLength: 32, maxLength: 32}}
          required: [jobId]
          additionalProperties: false
        request: {method: GET, path: "/jobs/{jobId}/metrics"}
        resources: [{type: "flink:job", pointer: /jobId}]

      - name: flink_get_job_config
        description: Configuration one job was submitted with.
        class: READ
        inputSchema:
          type: object
          properties: {jobId: {type: string, minLength: 32, maxLength: 32}}
          required: [jobId]
          additionalProperties: false
        request: {method: GET, path: "/jobs/{jobId}/config"}
        resources: [{type: "flink:job", pointer: /jobId}]

      - name: flink_list_checkpoints
        description: Checkpoint history and counts for one job.
        class: READ
        inputSchema:
          type: object
          properties: {jobId: {type: string, minLength: 32, maxLength: 32}}
          required: [jobId]
          additionalProperties: false
        request: {method: GET, path: "/jobs/{jobId}/checkpoints"}
        resources: [{type: "flink:job", pointer: /jobId}]

      - name: flink_get_savepoint_status
        description: Status and final location of a savepoint that flink_trigger_savepoint started.
        class: READ
        inputSchema:
          type: object
          properties:
            jobId: {type: string, minLength: 32, maxLength: 32}
            triggerId: {type: string, minLength: 32, maxLength: 32}
          required: [jobId, triggerId]
          additionalProperties: false
        request: {method: GET, path: "/jobs/{jobId}/savepoints/{triggerId}"}
        resources: [{type: "flink:job", pointer: /jobId}]

      # ---------------------------------------------------------------- writes
      - name: flink_trigger_savepoint
        description: Trigger a savepoint for a running job.
        class: MUTATE
        inputSchema:
          type: object
          properties:
            jobId: {type: string, minLength: 32, maxLength: 32}
            targetDirectory: {type: string, maxLength: 1024}
          required: [jobId, targetDirectory]
          additionalProperties: false
        request:
          method: POST
          path: "/jobs/{jobId}/savepoints"
          body: {"target-directory": "{targetDirectory}", "cancel-job": false}
        resources: [{type: "flink:job", pointer: /jobId}]

      - name: flink_rescale_job
        description: Change the parallelism of a running job.
        class: MUTATE
        inputSchema:
          type: object
          properties:
            jobId: {type: string, minLength: 32, maxLength: 32}
            parallelism: {type: integer, minimum: 1, maximum: 4096}
          required: [jobId, parallelism]
          additionalProperties: false
        # The endpoint is /rescaling, not /rescale. On this cluster Flink answers it with HTTP 503 and
        # "Rescaling is temporarily disabled. See FLINK-12312." The tutorial calls it on purpose, in
        # part 5.7, to show what an unavailable backend operation looks like once governance has
        # already said yes.
        request: {method: PATCH, path: "/jobs/{jobId}/rescaling", query: {parallelism: "{parallelism}"}}
        resources: [{type: "flink:job", pointer: /jobId}]

      - name: flink_stop_job
        description: Stop a job with a final savepoint. The job does not resume by itself.
        class: DESTRUCTIVE
        inputSchema:
          type: object
          properties:
            jobId: {type: string, minLength: 32, maxLength: 32}
            targetDirectory: {type: string, maxLength: 1024}
            drain: {type: boolean}
          required: [jobId, targetDirectory]
          additionalProperties: false
        request:
          method: POST
          path: "/jobs/{jobId}/stop"
          body: {"targetDirectory": "{targetDirectory}", "drain": "{drain}"}
        resources: [{type: "flink:job", pointer: /jobId}]
        dryRun: {mode: TOOL, previewTool: flink_get_job}

      - name: flink_cancel_job
        description: Cancel a running job. Irreversible for the running instance.
        class: DESTRUCTIVE
        inputSchema:
          type: object
          properties: {jobId: {type: string, minLength: 32, maxLength: 32}}
          required: [jobId]
          additionalProperties: false
        request: {method: PATCH, path: "/jobs/{jobId}", query: {mode: cancel}}
        resources: [{type: "flink:job", pointer: /jobId}]
        # GATEWAY on purpose, so this config shows both dry-run shapes: cancel sends nothing to Flink
        # and still issues a receipt, while flink_stop_job above validates against the real job first.
        dryRun: {mode: GATEWAY}

      - name: flink_run_jar
        description: Run an already uploaded jar as a new job. This starts code on the cluster.
        class: DESTRUCTIVE
        inputSchema:
          type: object
          properties:
            jarId: {type: string, maxLength: 256}
            entryClass: {type: string, maxLength: 512}
            parallelism: {type: integer, minimum: 1, maximum: 4096}
            programArgs: {type: string, maxLength: 4096}
          required: [jarId]
          additionalProperties: false
        request:
          method: POST
          path: "/jars/{jarId}/run"
          body: {"entryClass": "{entryClass}", "parallelism": "{parallelism}", "programArgs": "{programArgs}"}
        resources: [{type: "flink:jar", pointer: /jarId}]
        dryRun: {mode: TOOL, previewTool: flink_list_jars}

host:
  listen: {host: 127.0.0.1, port: 8080}
  identity:
    type: static
    static:
      tokens:
        - {tokenEnv: ANALYST_TOKEN, actor: ana, groups: [flink-users]}
        - {tokenEnv: OPERATOR_TOKEN, actor: oscar, groups: [flink-operators]}
        - {tokenEnv: APPROVER_TOKEN, actor: petra, groups: [flink-approvers]}
  stdio: {actor: ana, groups: [flink-users]}
