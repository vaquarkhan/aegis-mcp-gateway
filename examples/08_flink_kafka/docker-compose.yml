# Author: Viquar Khan
#
# Flink JobManager/TaskManager + Kafka (KRaft) + Aegis.
# Flink UI is published on 18081 to avoid clashing with a host Flink on 8081.
# Kafka is reachable as localhost:9092 from the host and kafka:9092 in-compose.
# Prerequisite:
#   mvn -q -pl mcp-gateway-dist -am package -DskipTests

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  flink-jobmanager:
    image: flink:1.20-java17
    command: jobmanager
    ports:
      - "18081:8081"
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager

  flink-taskmanager:
    image: flink:1.20-java17
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: "2"

  aegis:
    image: eclipse-temurin:17-jre
    depends_on:
      - flink-jobmanager
      - kafka
    working_dir: /opt/aegis
    volumes:
      - ../../mcp-gateway-dist/target/aegis-mcp-gateway-0.1.0-all.jar:/opt/aegis/aegis-mcp-gateway.jar:ro
      - ./tokens.example.txt:/opt/aegis/tokens.txt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MCP_GW_TRANSPORT: http
      MCP_GW_HTTP_HOST: 0.0.0.0
      MCP_GW_HTTP_PORT: "8090"
      MCP_GW_AUTH_MODE: tokenfile
      MCP_GW_AUTH_TOKENS_FILE: /opt/aegis/tokens.txt
      MCP_GW_ADAPTERS: flink,kafka
      # Prefer in-compose Flink; override to host.docker.internal:8081 to use a host Flink.
      FLINK_REST_URL: http://flink-jobmanager:8081
      KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
      MCP_GW_LOG_LEVEL: INFO
    ports:
      - "8090:8090"
    entrypoint: ["java", "-jar", "/opt/aegis/aegis-mcp-gateway.jar"]
