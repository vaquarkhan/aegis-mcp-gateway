# Apache Airflow: governed MCP tools over the Apache Airflow HTTP API, configuration only.
# Airflow 2.x stable REST API (/api/v1): GET /health, GET /dags, GET /dags/{dag_id},
# POST /dags/{dag_id}/dagRuns, DELETE /dags/{dag_id}. Airflow 3 replaced /api/v1 with /api/v2,
# so this file does not match an Airflow 3 api-server. No real Airflow run is recorded for it.
# Replaces the Aegis 0.1 Java adapter mcp-adapter-airflow (taxonomy: orchestration).
# Dry run defaults to GATEWAY (governance preflight only); tools that can validate against the
# exact target use dryRun mode TOOL with that read as the preview.

gateway:
  name: aegis-airflow

access:
  writeGroups: [airflow-operators]
  approverGroups: [airflow-approvers]

approval:
  keyEnv: AEGIS_SIGNING_KEY          # >= 32 bytes; shared by every replica

policy:
  rules:
    - {id: read, groups: [airflow-users, airflow-operators], classes: [READ]}
    - {id: operate, groups: [airflow-operators], classes: [MUTATE, DESTRUCTIVE]}

rateLimits:
  perCallerPerMinute: 120
  budgetPerHour: 2000

egress:
  allowCidrs: [127.0.0.0/8]           # your cluster network; the baseUrl host is allowed automatically

audit:
  file: audit/aegis-airflow.jsonl

sources:
  - id: airflow
    type: http
    baseUrl: http://127.0.0.1:49668/api/v1
    # Airflow 2.x REST uses HTTP basic for the API user (FAB auth).
    credentials: {type: basic, usernameEnv: AIRFLOW_API_USER, passwordEnv: AIRFLOW_API_PASSWORD}
    tools:
      - name: airflow_get_health
        description: "Airflow scheduler and metadata database health."
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: "/health"}

      - name: airflow_list_dags
        description: "List DAGs known to this Airflow instance."
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: "/dags"}

      - name: airflow_get_dag
        description: "Details of one DAG."
        class: READ
        inputSchema:
          type: object
          properties: {dagId: {type: string, maxLength: 200}}
          required: [dagId]
          additionalProperties: false
        request: {method: GET, path: "/dags/{dagId}"}
        resources: [{type: "airflow:dag", pointer: /dagId}]

      - name: airflow_trigger_dag
        description: "Trigger a new run of one DAG."
        class: MUTATE
        inputSchema:
          type: object
          properties: {dagId: {type: string, maxLength: 200}}
          required: [dagId]
          additionalProperties: false
        request:
          method: POST
          path: "/dags/{dagId}/dagRuns"
          body: {}
        resources: [{type: "airflow:dag", pointer: /dagId}]

      - name: airflow_delete_dag
        description: "Delete a DAG and its run history."
        class: DESTRUCTIVE
        inputSchema:
          type: object
          properties: {dagId: {type: string, maxLength: 200}}
          required: [dagId]
          additionalProperties: false
        request: {method: DELETE, path: "/dags/{dagId}"}
        resources: [{type: "airflow:dag", pointer: /dagId}]
        dryRun: {mode: TOOL, previewTool: airflow_get_dag}   # validate against the exact target first
