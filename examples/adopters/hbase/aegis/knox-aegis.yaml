# Apache HBase: governed MCP tools over the Apache HBase HTTP API, configuration only.
# HBase REST (Stargate): GET /version/cluster, GET /, GET and DELETE /{table}/schema.
# Replaces the Aegis 0.1 Java adapter mcp-adapter-hbase (taxonomy: datastore).
# Dry run defaults to GATEWAY (governance preflight only); tools that can validate against the
# exact target use dryRun mode TOOL with that read as the preview.

gateway:
  name: aegis-hbase

access:
  writeGroups: [hbase-operators]
  approverGroups: [hbase-approvers]

approval:
  keyEnv: AEGIS_SIGNING_KEY          # >= 32 bytes; shared by every replica

policy:
  rules:
    - {id: read, groups: [hbase-users, hbase-operators], classes: [READ]}
    - {id: operate, groups: [hbase-operators], classes: [MUTATE, DESTRUCTIVE]}
    # hbase:meta and hbase:namespace are HBase's own catalog tables
    - {id: never-drop-system-tables, effect: DENY, groups: ["*"], tools: [hbase_delete_table], resources: ["hbase:table:hbase*"]}

rateLimits:
  perCallerPerMinute: 120
  budgetPerHour: 2000

egress:
  allowCidrs: [127.0.0.0/8]           # your cluster network; the baseUrl host is allowed automatically

audit:
  file: audit/aegis-hbase.jsonl

sources:
  - id: hbase
    type: http
    baseUrl: http://127.0.0.1:65178
    tools:
      - name: hbase_cluster_version
        description: "Cluster version information."
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: "/version/cluster"}

      - name: hbase_list_tables
        description: "List tables."
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: "/"}

      - name: hbase_get_table_schema
        description: "Column families and settings of one table."
        class: READ
        inputSchema:
          type: object
          properties: {table: {type: string, maxLength: 256}}
          required: [table]
          additionalProperties: false
        request: {method: GET, path: "/{table}/schema"}
        resources: [{type: "hbase:table", pointer: /table}]

      - name: hbase_delete_table
        description: "Delete one table and all its data."
        class: DESTRUCTIVE
        inputSchema:
          type: object
          properties: {table: {type: string, maxLength: 256}}
          required: [table]
          additionalProperties: false
        request: {method: DELETE, path: "/{table}/schema"}
        resources: [{type: "hbase:table", pointer: /table}]
        dryRun: {mode: TOOL, previewTool: hbase_get_table_schema}   # validate against the exact target first
