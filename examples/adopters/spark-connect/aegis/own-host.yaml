# Apache Spark through Spark Connect (Spark 3.4+; tested with 4.0.1). The gateway is a Spark Connect
# client; Spark runs in its own server (sbin/start-connect-server.sh). Needs the aegis-spark-connect
# jar on the gateway classpath (type: spark-connect).
gateway:
  name: aegis-spark-connect

access:
  writeGroups: [spark-operators]
  approverGroups: [spark-approvers]

approval:
  keyEnv: AEGIS_SIGNING_KEY

policy:
  rules:
    - {id: read, groups: [spark-users, spark-operators], classes: [READ]}
    - {id: operate, groups: [spark-operators], classes: [DESTRUCTIVE], tools: [spark_drop_table, spark_sql]}
    - {id: no-prod-drop, effect: DENY, groups: ["*"], tools: [spark_drop_table], resources: ["spark:table:prod.*"]}

egress:
  # Spark Connect is gRPC over HTTP/2: the server is checked as http(s)://host:port.
  allowHosts: [127.0.0.1]
  schemes: [http, https]
  allowCidrs: [127.0.0.0/8]

audit:
  file: audit/aegis-spark-connect.jsonl

sources:
  - id: spark-connect
    type: spark-connect
    unlistedTools: HIDE           # only the tools below are exposed
    settings:
      host: 127.0.0.1
      port: 58281
      maxRows: 100
    tools:
      spark_list_databases: {class: READ}
      spark_list_tables: {class: READ}
      spark_describe_table:
        class: READ
        resources: [{type: "spark:table", pointer: /table}]
      spark_preview_table:
        class: READ
        resources: [{type: "spark:table", pointer: /table}]
      spark_explain_sql: {class: READ}
      spark_drop_table:
        class: DESTRUCTIVE
        resources: [{type: "spark:table", pointer: /table}]
        dryRun: {mode: TOOL, previewTool: spark_describe_table}
      spark_sql:
        class: DESTRUCTIVE        # arbitrary SQL can write: never READ, whatever the text looks like
        dryRun: {mode: TOOL, previewTool: spark_explain_sql}

# Appended for the own-host front door: loopback listener, static tokens per persona.
host:
  listen: {host: 127.0.0.1, port: 0}
  identity:
    type: static
    static:
      tokens:
        - {tokenEnv: AEGIS_VALIDATION_TOKEN_READER, actor: guest, groups: [spark-users]}
        - {tokenEnv: AEGIS_VALIDATION_TOKEN_OPERATOR, actor: sam, groups: [spark-operators]}
        - {tokenEnv: AEGIS_VALIDATION_TOKEN_APPROVER, actor: tom, groups: [spark-approvers]}
        - {tokenEnv: AEGIS_VALIDATION_TOKEN_OUTSIDER, actor: admin, groups: []}
