# Apache CouchDB: governed MCP tools over the Apache CouchDB HTTP API, configuration only.
# CouchDB HTTP API: GET /_all_dbs, GET /{db}, PUT /{db}, DELETE /{db}.
# Replaces the Aegis 0.1 Java adapter mcp-adapter-couchdb (taxonomy: datastore).
# Dry run defaults to GATEWAY (governance preflight only); tools that can validate against the
# exact target use dryRun mode TOOL with that read as the preview.

gateway:
  name: aegis-couchdb

access:
  writeGroups: [couchdb-operators]
  approverGroups: [couchdb-approvers]

approval:
  keyEnv: AEGIS_SIGNING_KEY          # >= 32 bytes; shared by every replica

policy:
  rules:
    - {id: read, groups: [couchdb-users, couchdb-operators], classes: [READ]}
    - {id: operate, groups: [couchdb-operators], classes: [MUTATE, DESTRUCTIVE]}
    # _users, _replicator and _global_changes are CouchDB's own databases
    - {id: never-drop-system-dbs, effect: DENY, groups: ["*"], tools: [couchdb_delete_db], resources: ["couchdb:db:_*"]}

rateLimits:
  perCallerPerMinute: 120
  budgetPerHour: 2000

egress:
  allowCidrs: [127.0.0.0/8]           # your cluster network; the baseUrl host is allowed automatically

audit:
  file: audit/aegis-couchdb.jsonl

sources:
  - id: couchdb
    type: http
    baseUrl: http://127.0.0.1:59672
    # CouchDB 3+ requires an admin; the gateway holds that credential (never the caller's).
    credentials: {type: basic, usernameEnv: COUCHDB_USER, passwordEnv: COUCHDB_PASSWORD}
    tools:
      - name: couchdb_list_dbs
        description: "List databases."
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: "/_all_dbs"}

      - name: couchdb_get_db
        description: "Information about one database."
        class: READ
        inputSchema:
          type: object
          properties: {db: {type: string, maxLength: 256}}
          required: [db]
          additionalProperties: false
        request: {method: GET, path: "/{db}"}
        resources: [{type: "couchdb:db", pointer: /db}]

      - name: couchdb_create_db
        description: "Create a database."
        class: MUTATE
        inputSchema:
          type: object
          properties: {db: {type: string, maxLength: 256}}
          required: [db]
          additionalProperties: false
        request:
          method: PUT
          path: "/{db}"
          body: {}
        resources: [{type: "couchdb:db", pointer: /db}]

      - name: couchdb_delete_db
        description: "Delete a database and all its documents."
        class: DESTRUCTIVE
        inputSchema:
          type: object
          properties: {db: {type: string, maxLength: 256}}
          required: [db]
          additionalProperties: false
        request: {method: DELETE, path: "/{db}"}
        resources: [{type: "couchdb:db", pointer: /db}]
        dryRun: {mode: TOOL, previewTool: couchdb_get_db}   # validate against the exact target first

# Appended for the own-host front door: loopback listener, static tokens per persona.
host:
  listen: {host: 127.0.0.1, port: 0}
  identity:
    type: static
    static:
      tokens:
        - {tokenEnv: AEGIS_VALIDATION_TOKEN_READER, actor: guest, groups: [couchdb-users]}
        - {tokenEnv: AEGIS_VALIDATION_TOKEN_OPERATOR, actor: sam, groups: [couchdb-operators]}
        - {tokenEnv: AEGIS_VALIDATION_TOKEN_APPROVER, actor: tom, groups: [couchdb-approvers]}
        - {tokenEnv: AEGIS_VALIDATION_TOKEN_OUTSIDER, actor: admin, groups: []}
