# =================================================================================================
# Break-glass MCP server: Apache Kafka   (examples/break-glass-mcp-servers/kafka)
#
# This file IS the MCP server. `java -jar aegis-gateway...-all.jar --config aegis.yaml` serves every
# tool below as a governed MCP tool at http://127.0.0.1:18804/mcp, in front of
# the local Kafka 3.9.1 KRaft broker (127.0.0.1:19092) and Connect worker (127.0.0.1:18083).
#
# It is the shipped profile adopters/configurations/kafka/kafka.yaml with only these changes:
#   - the engine address points at the local engine, and egress allows loopback;
#   - the audit journal is written under ./run;
#   - three sections are appended at the end: catalog, serverCatalog (with the break-glass block)
#     and host.
# Do not edit the sources: section without re-signing: the signed server catalog pins its digest,
# and the gateway refuses to start when it no longer matches.
# =================================================================================================
# Apache Kafka, two ways in one file:
#  1. Kafka Connect REST API (part of Apache Kafka): GET /connectors, GET /connectors/{name}/status,
#     PUT /connectors/{name}/pause, DELETE /connectors/{name}. Configuration only.
#  2. Topics through the Kafka Admin client, via the kafka-admin plugin source (ServiceLoader), for
#     brokers that have no REST layer. Needs kafka-clients and aegis-examples on the classpath.
gateway:
  name: aegis-kafka

access:
  writeGroups: [kafka-operators]
  approverGroups: [kafka-approvers]

approval:
  keyEnv: AEGIS_SIGNING_KEY

policy:
  rules:
    - {id: read, groups: [kafka-users, kafka-operators], classes: [READ]}
    - {id: operate, groups: [kafka-operators], classes: [MUTATE, DESTRUCTIVE]}
    - {id: protect-internal, effect: DENY, groups: ["*"], resources: ["kafka:topic:__*", "kafka:topic:_*"]}

egress:
  allowCidrs: [127.0.0.0/8]

audit:
  file: ./run/audit/aegis-kafka.jsonl

sources:
  - id: kafka-connect
    type: http
    baseUrl: http://127.0.0.1:18083
    tools:
      - name: connect_list_connectors
        description: List Kafka Connect connectors.
        class: READ
        request: {method: GET, path: /connectors}

      - name: connect_connector_status
        description: Status of one connector and its tasks.
        class: READ
        inputSchema:
          type: object
          properties: {name: {type: string, maxLength: 249}}
          required: [name]
          additionalProperties: false
        request: {method: GET, path: "/connectors/{name}/status"}
        resources: [{type: "kafka:connector", pointer: /name}]

      - name: connect_connector_config
        description: Current configuration of one connector.
        class: READ
        inputSchema:
          type: object
          properties: {name: {type: string, maxLength: 249}}
          required: [name]
          additionalProperties: false
        request: {method: GET, path: "/connectors/{name}/config"}
        resources: [{type: "kafka:connector", pointer: /name}]

      - name: connect_pause_connector
        description: Pause a connector (resumable).
        class: MUTATE
        inputSchema:
          type: object
          properties: {name: {type: string, maxLength: 249}}
          required: [name]
          additionalProperties: false
        request: {method: PUT, path: "/connectors/{name}/pause"}
        resources: [{type: "kafka:connector", pointer: /name}]

      - name: connect_resume_connector
        description: Resume a paused connector.
        class: MUTATE
        inputSchema:
          type: object
          properties: {name: {type: string, maxLength: 249}}
          required: [name]
          additionalProperties: false
        request: {method: PUT, path: "/connectors/{name}/resume"}
        resources: [{type: "kafka:connector", pointer: /name}]

      - name: connect_restart_connector
        description: Restart a connector and optionally its tasks.
        class: MUTATE
        inputSchema:
          type: object
          properties:
            name: {type: string, maxLength: 249}
            includeTasks: {type: boolean}
            onlyFailed: {type: boolean}
          required: [name]
          additionalProperties: false
        request:
          method: POST
          path: "/connectors/{name}/restart"
          query: {includeTasks: "{includeTasks}", onlyFailed: "{onlyFailed}"}
        resources: [{type: "kafka:connector", pointer: /name}]

      - name: connect_delete_connector
        description: Delete a connector and its configuration.
        class: DESTRUCTIVE
        inputSchema:
          type: object
          properties: {name: {type: string, maxLength: 249}}
          required: [name]
          additionalProperties: false
        request: {method: DELETE, path: "/connectors/{name}"}
        resources: [{type: "kafka:connector", pointer: /name}]

  # Confluent Schema Registry API, which Kafka deployments almost always run next to Connect. Separate
  # source because it is a different service on a different port with its own credential.
  - id: schema-registry
    type: http
    baseUrl: http://schema-registry:8081
    tools:
      - name: schema_list_subjects
        description: List schema subjects in the registry.
        class: READ
        inputSchema: {type: object, properties: {}, additionalProperties: false}
        request: {method: GET, path: /subjects}

      - name: schema_latest_version
        description: Latest registered schema for one subject.
        class: READ
        inputSchema:
          type: object
          properties: {subject: {type: string, maxLength: 512}}
          required: [subject]
          additionalProperties: false
        request: {method: GET, path: "/subjects/{subject}/versions/latest"}
        resources: [{type: "kafka:subject", pointer: /subject}]

      - name: schema_check_compatibility
        description: Test whether a schema would be compatible with a subject. Registers nothing.
        class: READ
        inputSchema:
          type: object
          properties:
            subject: {type: string, maxLength: 512}
            schema: {type: string, maxLength: 262144}
          required: [subject, schema]
          additionalProperties: false
        request:
          method: POST
          path: "/compatibility/subjects/{subject}/versions/latest"
          body: {"schema": "{schema}"}
        resources: [{type: "kafka:subject", pointer: /subject}]

  - id: kafka-admin
    type: kafka-admin
    unlistedTools: HIDE
    settings:
      bootstrapServers: 127.0.0.1:19092
      requestTimeoutMs: 15000
    tools:
      kafka_list_topics: {class: READ}
      kafka_describe_cluster: {class: READ}
      kafka_describe_topic:
        class: READ
        resources: [{type: "kafka:topic", pointer: /topic}]
      kafka_describe_topic_configs:
        class: READ
        resources: [{type: "kafka:topic", pointer: /topic}]
      kafka_create_topic:
        class: MUTATE
        resources: [{type: "kafka:topic", pointer: /topic}]
        dryRun: {mode: ARGUMENT, argument: validateOnly}   # Kafka's own CreateTopics validate-only
      kafka_delete_topic:
        class: DESTRUCTIVE
        resources: [{type: "kafka:topic", pointer: /topic}]

# =================================================================================================
# Appended for the break-glass MCP server
# =================================================================================================

# Nothing is trusted on first sight: every tool definition must be pinned, here only by the
# signed server catalog. Run-time acceptance is refused while a server catalog is in force.
catalog:
  mode: REQUIRE_PINS

# The offline, Ed25519-signed register of which sources above may start, with each source's
# configuration digest and its exact tool pins. Created by Run-EndToEnd.ps1 (or by hand with
# --server-catalog-create and --manifest-sign); the private review key stays in ./run/keys.
serverCatalog:
  file: ./run/servers.json
  publicKeyFile: ./run/review.pub
  # BREAK-GLASS. During an incident, a responder signs a contain-only order with a SEPARATE incident key
  # (--break-glass-create, --manifest-sign) and enables these three lines. The order can only
  # quarantine or revoke servers, for at most 24 hours; an expired order stops the gateway from starting.
  # Start-McpServer.ps1 -Mode break-glass serves a copy of this file with them enabled.
  # breakGlass:
  #   file: ./run/order.json
  #   publicKeyFile: ./run/incident.pub

# Aegis's own MCP server on loopback. One static bearer token per person; the values come from the
# environment (the scripts generate them into ./run/keys/tokens.json). Use JWT and TLS outside a demo.
host:
  listen: {host: 127.0.0.1, port: 18804}
  identity:
    type: static
    static:
      tokens:
        - {tokenEnv: AEGIS_BG_READER, actor: reader, groups: [kafka-users]}
        - {tokenEnv: AEGIS_BG_OPERATOR, actor: operator, groups: [kafka-operators]}
        - {tokenEnv: AEGIS_BG_APPROVER, actor: approver, groups: [kafka-approvers]}
        - {tokenEnv: AEGIS_BG_OUTSIDER, actor: outsider, groups: []}
  # For an IDE that launches the server itself (java ... --config aegis.yaml --stdio): there is no
  # network listener and no token; every call runs as this fixed, read-only identity.
  stdio: {actor: developer, groups: [kafka-users]}
