# =================================================================================================
# Break-glass MCP server: Apache Spark   (examples/break-glass-mcp-servers/spark)
#
# This file IS the MCP server. `java -jar aegis-gateway...-all.jar --config aegis.yaml` serves every
# tool below as a governed MCP tool at http://127.0.0.1:18803/mcp, in front of
# the local Spark 4.0.1 application UI (127.0.0.1:14040) and standalone Master REST (127.0.0.1:16066), engine/SparkServices.java.
#
# It is the shipped profile adopters/configurations/spark/spark.yaml with only these changes:
#   - the engine address points at the local engine, and egress allows loopback;
#   - the audit journal is written under ./run;
#   - three sections are appended at the end: catalog, serverCatalog (with the break-glass block)
#     and host.
# Do not edit the sources: section without re-signing: the signed server catalog pins its digest,
# and the gateway refuses to start when it no longer matches.
# =================================================================================================
# Apache Spark: read tools over the Spark monitoring REST API (/api/v1 on the History Server or a
# driver UI), and a destructive kill over the standalone master REST submission server.
# Note: the kill endpoint exists only for standalone cluster mode and only when
# spark.master.rest.enabled=true on the master (it is disabled by default). Leave that source out
# if you run on YARN or Kubernetes.
gateway:
  name: aegis-spark

access:
  writeGroups: [spark-operators]
  approverGroups: [spark-approvers]

approval:
  keyEnv: AEGIS_SIGNING_KEY

policy:
  rules:
    - {id: read-apps, groups: [spark-users, spark-operators], classes: [READ]}
    - {id: kill-apps, groups: [spark-operators], classes: [DESTRUCTIVE], tools: [spark_kill_submission]}
    # Submitting a jar starts code on the cluster, so the jar is allow-listed rather than the action.
    # Change the pattern to your artifact location; an unlisted jar is POLICY_DENIED at step 3.
    - {id: submit-approved-jars, groups: [spark-operators], classes: [DESTRUCTIVE], tools: [spark_submit_batch],
       resources: ["spark:jar:hdfs:///approved/*"]}

egress:
  allowCidrs: [127.0.0.0/8]

audit:
  file: ./run/audit/aegis-spark.jsonl

sources:
  - id: spark-history
    type: http
    baseUrl: http://127.0.0.1:14040
    tools:
      - name: spark_list_applications
        description: List Spark applications known to the History Server.
        class: READ
        inputSchema:
          type: object
          properties: {status: {type: string, enum: [completed, running]}, limit: {type: integer, minimum: 1, maximum: 500}}
          additionalProperties: false
        request: {method: GET, path: /api/v1/applications, query: {status: "{status}", limit: "{limit}"}}

      - name: spark_get_application
        description: Attempts, duration and completion state of one Spark application.
        class: READ
        inputSchema:
          type: object
          properties: {appId: {type: string, maxLength: 128}}
          required: [appId]
          additionalProperties: false
        request: {method: GET, path: "/api/v1/applications/{appId}"}
        resources: [{type: "spark:app", pointer: /appId}]

      - name: spark_list_jobs
        description: List jobs of one Spark application.
        class: READ
        inputSchema:
          type: object
          properties: {appId: {type: string, maxLength: 128}}
          required: [appId]
          additionalProperties: false
        request: {method: GET, path: "/api/v1/applications/{appId}/jobs"}
        resources: [{type: "spark:app", pointer: /appId}]

      - name: spark_list_stages
        description: Stage summaries of one Spark application, the same data the Stages tab shows.
        class: READ
        inputSchema:
          type: object
          properties: {appId: {type: string, maxLength: 128}}
          required: [appId]
          additionalProperties: false
        request: {method: GET, path: "/api/v1/applications/{appId}/stages"}
        resources: [{type: "spark:app", pointer: /appId}]

      - name: spark_list_executors
        description: Executor list with task, memory and shuffle counters for one application.
        class: READ
        inputSchema:
          type: object
          properties: {appId: {type: string, maxLength: 128}}
          required: [appId]
          additionalProperties: false
        request: {method: GET, path: "/api/v1/applications/{appId}/executors"}
        resources: [{type: "spark:app", pointer: /appId}]

      - name: spark_get_environment
        description: Spark properties and classpath of one application, useful for drift questions.
        class: READ
        inputSchema:
          type: object
          properties: {appId: {type: string, maxLength: 128}}
          required: [appId]
          additionalProperties: false
        request: {method: GET, path: "/api/v1/applications/{appId}/environment"}
        resources: [{type: "spark:app", pointer: /appId}]

  - id: spark-master
    type: http
    baseUrl: http://127.0.0.1:16066
    tools:
      - name: spark_submission_status
        description: Status of one driver submitted in standalone cluster mode.
        class: READ
        inputSchema:
          type: object
          properties: {submissionId: {type: string, maxLength: 128}}
          required: [submissionId]
          additionalProperties: false
        request: {method: GET, path: "/v1/submissions/status/{submissionId}"}
        resources: [{type: "spark:submission", pointer: /submissionId}]

      - name: spark_kill_submission
        description: Kill a driver submitted in standalone cluster mode.
        class: DESTRUCTIVE
        inputSchema:
          type: object
          properties: {submissionId: {type: string, maxLength: 128}}
          required: [submissionId]
          additionalProperties: false
        request: {method: POST, path: "/v1/submissions/kill/{submissionId}"}
        resources: [{type: "spark:submission", pointer: /submissionId}]
        dryRun: {mode: TOOL, previewTool: spark_submission_status}

      - name: spark_submit_batch
        description: Submit a jar as a new driver in standalone cluster mode. This starts code on the cluster.
        class: DESTRUCTIVE
        inputSchema:
          type: object
          properties:
            appResource: {type: string, maxLength: 1024}
            mainClass: {type: string, maxLength: 512}
            appArgs: {type: array, items: {type: string, maxLength: 1024}, maxItems: 64}
            sparkProperties: {type: object}
          required: [appResource, mainClass]
          additionalProperties: false
        # The standalone REST submission body. clientSparkVersion and action are fixed by the operator
        # here, so a caller cannot change what kind of request this is.
        request:
          method: POST
          path: /v1/submissions/create
          body:
            action: CreateSubmissionRequest
            clientSparkVersion: "4.0.1"
            appResource: "{appResource}"
            mainClass: "{mainClass}"
            appArgs: "{appArgs}"
            sparkProperties: "{sparkProperties}"
            environmentVariables: {}
        # The jar being submitted is the governed resource, so policy decides which jars may run.
        resources: [{type: "spark:jar", pointer: /appResource}]

# =================================================================================================
# Appended for the break-glass MCP server
# =================================================================================================

# Nothing is trusted on first sight: every tool definition must be pinned, here only by the
# signed server catalog. Run-time acceptance is refused while a server catalog is in force.
catalog:
  mode: REQUIRE_PINS

# The offline, Ed25519-signed register of which sources above may start, with each source's
# configuration digest and its exact tool pins. Created by Run-EndToEnd.ps1 (or by hand with
# --server-catalog-create and --manifest-sign); the private review key stays in ./run/keys.
serverCatalog:
  file: ./run/servers.json
  publicKeyFile: ./run/review.pub
  # BREAK-GLASS. During an incident, a responder signs a contain-only order with a SEPARATE incident key
  # (--break-glass-create, --manifest-sign) and enables these three lines. The order can only
  # quarantine or revoke servers, for at most 24 hours; an expired order stops the gateway from starting.
  # Start-McpServer.ps1 -Mode break-glass serves a copy of this file with them enabled.
  # breakGlass:
  #   file: ./run/order.json
  #   publicKeyFile: ./run/incident.pub

# Aegis's own MCP server on loopback. One static bearer token per person; the values come from the
# environment (the scripts generate them into ./run/keys/tokens.json). Use JWT and TLS outside a demo.
host:
  listen: {host: 127.0.0.1, port: 18803}
  identity:
    type: static
    static:
      tokens:
        - {tokenEnv: AEGIS_BG_READER, actor: reader, groups: [spark-users]}
        - {tokenEnv: AEGIS_BG_OPERATOR, actor: operator, groups: [spark-operators]}
        - {tokenEnv: AEGIS_BG_APPROVER, actor: approver, groups: [spark-approvers]}
        - {tokenEnv: AEGIS_BG_OUTSIDER, actor: outsider, groups: []}
  # For an IDE that launches the server itself (java ... --config aegis.yaml --stdio): there is no
  # network listener and no token; every call runs as this fixed, read-only identity.
  stdio: {actor: developer, groups: [spark-users]}
