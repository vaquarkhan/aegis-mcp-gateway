<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">Aegis destructive-action governance flow</title>
  <desc id="description">A destructive MCP action is normalized and bound, checked by automated controls, previewed, reviewed by an independent approver, committed to single-use state and a hash-chained journal, then executed with a backend credential and guarded output. Any refusal follows the denial lane and never reaches the backend.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d33"/><stop offset="1" stop-color="#0b536c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b2940" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,1 L10,5.5 L0,10 Z" fill="#287792"/>
    </marker>
    <marker id="denyArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,1 L10,5.5 L0,10 Z" fill="#bd4555"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 750; fill: #ffffff; }
      .subtitle { font-size: 16px; fill: #c9e7f1; }
      .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.4px; fill: #32728a; }
      .stepTitle { font-size: 18px; font-weight: 750; fill: #102f45; }
      .body { font-size: 13px; fill: #3a596b; }
      .small { font-size: 12px; font-weight: 650; fill: #4c6978; }
      .number { font-size: 15px; font-weight: 800; fill: #ffffff; }
      .flow { fill: none; stroke: #287792; stroke-width: 3; marker-end: url(#arrow); }
      .deny { fill: none; stroke: #bd4555; stroke-width: 2.5; marker-end: url(#denyArrow); }
      .drop { fill: none; stroke: #d36a76; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#denyArrow); }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f5f9fc"/>
  <rect x="24" y="22" width="1552" height="104" rx="23" fill="url(#header)"/>
  <text x="62" y="67" class="title">Destructive actions become executable through evidence, not privilege</text>
  <text x="62" y="98" class="subtitle">The backend is unreachable until automated controls, preview, independent approval and journal-first commit all succeed.</text>

  <!-- Full action binding -->
  <rect x="50" y="153" width="1500" height="72" rx="16" fill="#fff8e8" stroke="#d9ad4a" stroke-width="2"/>
  <text x="76" y="181" style="font:800 12px 'Segoe UI',Arial;letter-spacing:1.3px;fill:#845600">ONE ACTION BINDING THROUGH EVERY STEP</text>
  <text x="76" y="207" style="font:600 15px 'Segoe UI',Arial;fill:#4f4c3d">caller + gateway + tool + class + source + typed resources + argument digest + pinned definition digest</text>
  <rect x="1300" y="171" width="218" height="36" rx="18" fill="#ffedbd"/>
  <text x="1409" y="194" style="font:750 12px 'Segoe UI',Arial;fill:#80520a" text-anchor="middle">REPLAY CHANGES THE BINDING</text>

  <!-- Main flow arrows behind cards -->
  <path d="M278 352 H304" class="flow"/><path d="M530 352 H556" class="flow"/>
  <path d="M782 352 H808" class="flow"/><path d="M1034 352 H1060" class="flow"/>
  <path d="M1286 352 H1312" class="flow"/>

  <!-- Step cards -->
  <g filter="url(#shadow)">
    <rect x="50" y="270" width="228" height="174" rx="18" fill="#ffffff" stroke="#95bdcc"/>
    <rect x="50" y="270" width="228" height="9" rx="4" fill="#247a96"/>
    <circle cx="82" cy="309" r="18" fill="#247a96"/><text x="82" y="315" class="number" text-anchor="middle">1</text>
    <text x="110" y="315" class="stepTitle">Normalize</text>
    <text x="76" y="348" class="body">Resolve caller and tool</text>
    <text x="76" y="370" class="body">Validate schema</text>
    <text x="76" y="392" class="body">Extract typed resources</text>
    <rect x="76" y="410" width="176" height="25" rx="8" fill="#edf6f9"/>
    <text x="164" y="427" class="small" text-anchor="middle">canonical action fixed</text>

    <rect x="304" y="270" width="226" height="174" rx="18" fill="#ffffff" stroke="#95bdcc"/>
    <rect x="304" y="270" width="226" height="9" rx="4" fill="#247a96"/>
    <circle cx="336" cy="309" r="18" fill="#247a96"/><text x="336" y="315" class="number" text-anchor="middle">2</text>
    <text x="364" y="315" class="stepTitle">Automated gates</text>
    <text x="330" y="348" class="body">Policy and egress</text>
    <text x="330" y="370" class="body">Rate, budget and breaker</text>
    <text x="330" y="392" class="body">Screening and hooks</text>
    <rect x="330" y="410" width="174" height="25" rx="8" fill="#edf6f9"/>
    <text x="417" y="427" class="small" text-anchor="middle">first denial wins</text>

    <rect x="556" y="270" width="226" height="174" rx="18" fill="#ffffff" stroke="#83c3b3"/>
    <rect x="556" y="270" width="226" height="9" rx="4" fill="#16806e"/>
    <circle cx="588" cy="309" r="18" fill="#16806e"/><text x="588" y="315" class="number" text-anchor="middle">3</text>
    <text x="616" y="315" class="stepTitle">Preview</text>
    <text x="582" y="348" class="body">Gateway preflight, native</text>
    <text x="582" y="370" class="body">validate flag, or READ tool</text>
    <text x="582" y="392" class="body">Redact preview evidence</text>
    <rect x="582" y="410" width="174" height="25" rx="8" fill="#e7f6f1"/>
    <text x="669" y="427" class="small" text-anchor="middle">issue one-time receipt</text>

    <rect x="808" y="270" width="226" height="174" rx="18" fill="#ffffff" stroke="#83c3b3"/>
    <rect x="808" y="270" width="226" height="9" rx="4" fill="#16806e"/>
    <circle cx="840" cy="309" r="18" fill="#16806e"/><text x="840" y="315" class="number" text-anchor="middle">4</text>
    <text x="868" y="315" class="stepTitle">Independent review</text>
    <text x="834" y="348" class="body">Show redacted arguments</text>
    <text x="834" y="370" class="body">and dry-run preview</text>
    <text x="834" y="392" class="body">Journal decision first</text>
    <rect x="834" y="410" width="174" height="25" rx="8" fill="#e7f6f1"/>
    <text x="921" y="427" class="small" text-anchor="middle">no self or delegated approval</text>

    <rect x="1060" y="270" width="226" height="174" rx="18" fill="#ffffff" stroke="#83c3b3"/>
    <rect x="1060" y="270" width="226" height="9" rx="4" fill="#16806e"/>
    <circle cx="1092" cy="309" r="18" fill="#16806e"/><text x="1092" y="315" class="number" text-anchor="middle">5</text>
    <text x="1120" y="315" class="stepTitle">Commit</text>
    <text x="1086" y="348" class="body">Verify binding and expiry</text>
    <text x="1086" y="370" class="body">Atomically consume tokens</text>
    <text x="1086" y="392" class="body">Write ALLOW_INTENT</text>
    <rect x="1086" y="410" width="174" height="25" rx="8" fill="#e7f6f1"/>
    <text x="1173" y="427" class="small" text-anchor="middle">audit failure stops here</text>

    <rect x="1312" y="270" width="238" height="174" rx="18" fill="#ffffff" stroke="#95bdcc"/>
    <rect x="1312" y="270" width="238" height="9" rx="4" fill="#247a96"/>
    <circle cx="1344" cy="309" r="18" fill="#247a96"/><text x="1344" y="315" class="number" text-anchor="middle">6</text>
    <text x="1372" y="315" class="stepTitle">Execute and guard</text>
    <text x="1338" y="348" class="body">Resolve backend credential</text>
    <text x="1338" y="370" class="body">Call approved source once</text>
    <text x="1338" y="392" class="body">Bound, redact, then journal</text>
    <rect x="1338" y="410" width="186" height="25" rx="8" fill="#edf6f9"/>
    <text x="1431" y="427" class="small" text-anchor="middle">caller token never forwarded</text>
  </g>

  <!-- Denial drops -->
  <path d="M164 444 V520" class="drop"/><path d="M417 444 V520" class="drop"/>
  <path d="M669 444 V520" class="drop"/><path d="M921 444 V520" class="drop"/>
  <path d="M1173 444 V520" class="drop"/>
  <text x="50" y="506" class="eyebrow" style="fill:#9b3442">FAIL-CLOSED DENIAL LANE</text>
  <rect x="50" y="526" width="1236" height="98" rx="18" fill="#fff1f3" stroke="#dc8b96" stroke-width="2"/>
  <circle cx="94" cy="575" r="24" fill="#bd4555"/>
  <path d="M83 564 L105 586 M105 564 L83 586" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="132" y="564" style="font:750 18px 'Segoe UI',Arial;fill:#782633">Stable deny code and step</text>
  <text x="132" y="590" class="body">Unknown tool, invalid input, policy refusal, unsafe egress, exhausted budget, failed hook, missing receipt,</text>
  <text x="132" y="612" class="body">self-approval, replay, changed definition or unavailable journal all stop before backend execution.</text>
  <rect x="1312" y="526" width="238" height="98" rx="18" fill="#e8f6f2" stroke="#74b9a8" stroke-width="2"/>
  <text x="1431" y="562" style="font:750 17px 'Segoe UI',Arial;fill:#116554" text-anchor="middle">ONLY THIS STEP</text>
  <text x="1431" y="587" class="body" text-anchor="middle">can reach the backend</text>
  <text x="1431" y="608" class="small" text-anchor="middle">after journal-first commit</text>

  <!-- Footer evidence -->
  <rect x="50" y="658" width="1500" height="62" rx="15" fill="#eaf4f8" stroke="#b3d0db"/>
  <text x="76" y="684" class="eyebrow">EVIDENCE PRODUCED</text>
  <text x="76" y="706" class="body">canonical action digest | redacted approver evidence | single-use receipt | named decision | ALLOW_INTENT | guarded result | trace correlation</text>
</svg>
