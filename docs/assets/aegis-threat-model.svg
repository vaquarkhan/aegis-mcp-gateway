<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="980" viewBox="0 0 1480 980" role="img" aria-labelledby="title description">
  <title id="title">Aegis MCP threat model: trust zones, STRIDE, and gateway boundary</title>
  <desc id="description">Untrusted agent context and authenticated callers reach Aegis through a host perimeter. The governance core applies identity, catalog, policy, egress, approval, receipt, hooks, and audit before resolving backend credentials. STRIDE threats map to gateway controls; residual risks remain with IdP, network, backend, and operator duties.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061e35"/><stop offset="1" stop-color="#0a6b66"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5f7f2"/><stop offset="1" stop-color="#f7fffc"/></linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#123042" flood-opacity=".15"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,1 L10,5.5 L0,10 Z" fill="#27768a"/></marker>
    <marker id="riskArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,1 L10,5.5 L0,10 Z" fill="#bd5447"/></marker>
    <style>
      text { font-family: &quot;Segoe UI&quot;, Arial, sans-serif; }
      .title { font-size: 32px; font-weight: 800; fill: #fff; }
      .sub { font-size: 15px; fill: #d7f0ed; }
      .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.3px; fill: #5a7380; }
      .heading { font-size: 18px; font-weight: 800; fill: #123246; }
      .label { font-size: 14px; font-weight: 750; fill: #173a4b; }
      .body { font-size: 12px; fill: #4a6674; }
      .tiny { font-size: 11px; font-weight: 700; fill: #52717b; }
      .stride { font-size: 13px; font-weight: 800; fill: #123246; }
      .safe { fill: none; stroke: #27768a; stroke-width: 2.5; marker-end: url(#arrow); }
      .risk { fill: none; stroke: #bd5447; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#riskArrow); }
    </style>
  </defs>

  <rect width="1480" height="980" fill="#f5fafb"/>
  <rect x="24" y="20" width="1432" height="100" rx="20" fill="url(#header)"/>
  <text x="58" y="60" class="title">Aegis threat model: every MCP call crosses one governed boundary</text>
  <text x="58" y="90" class="sub">Trust zones, STRIDE responses, and residual operator duties. Gateway handling is not a claim that every OWASP MCP risk is eliminated.</text>

  <!-- Zone labels -->
  <text x="58" y="150" class="eyebrow">UNTRUSTED / CLIENT ZONE</text>
  <text x="390" y="150" class="eyebrow">HOST PERIMETER</text>
  <text x="690" y="150" class="eyebrow">AEGIS GOVERNANCE CORE (TRUST BOUNDARY)</text>
  <text x="1220" y="150" class="eyebrow">BACKEND ZONE</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="40" y="170" width="300" height="250" rx="18" fill="#fff" stroke="#c9a8a4"/>
  </g>
  <text x="190" y="205" class="heading" text-anchor="middle">Agent / MCP client</text>
  <text x="190" y="230" class="body" text-anchor="middle">May be prompt-injected</text>
  <rect x="68" y="250" width="244" height="44" rx="10" fill="#fdeceb"/><text x="190" y="277" class="label" text-anchor="middle">Untrusted context</text>
  <rect x="68" y="308" width="244" height="44" rx="10" fill="#eef7fa"/><text x="190" y="335" class="label" text-anchor="middle">Authenticated caller JWT</text>
  <text x="190" y="385" class="tiny" text-anchor="middle">Never trusted for authorization</text>

  <path d="M340 295 H385" class="safe"/>

  <!-- Host -->
  <g filter="url(#shadow)">
    <rect x="385" y="170" width="260" height="250" rx="18" fill="#fff" stroke="#8cb6ca"/>
  </g>
  <text x="515" y="205" class="heading" text-anchor="middle">Host perimeter</text>
  <text x="515" y="230" class="body" text-anchor="middle">Own-host or Knox</text>
  <rect x="410" y="252" width="210" height="36" rx="9" fill="#eef7fa"/><text x="515" y="275" class="tiny" text-anchor="middle">TLS / JWT / SPIFFE / Knox Subject</text>
  <rect x="410" y="298" width="210" height="36" rx="9" fill="#eef7fa"/><text x="515" y="321" class="tiny" text-anchor="middle">Route groups, CORS, scopes</text>
  <rect x="410" y="344" width="210" height="36" rx="9" fill="#eef7fa"/><text x="515" y="367" class="tiny" text-anchor="middle">Body size / method binding</text>

  <path d="M645 295 H685" class="safe"/>

  <!-- Core -->
  <g filter="url(#shadow)">
    <rect x="685" y="170" width="480" height="420" rx="20" fill="url(#core)" stroke="#48a392" stroke-width="2"/>
  </g>
  <text x="925" y="205" class="heading" text-anchor="middle">GovernanceEngine decides before credentials</text>
  <text x="925" y="228" class="body" text-anchor="middle">Caller, tool class, typed resources, digests, approval, receipt, audit</text>

  <rect x="710" y="250" width="140" height="58" rx="10" fill="#fff" stroke="#9ed0c4"/><text x="780" y="275" class="label" text-anchor="middle">Catalog pins</text><text x="780" y="295" class="tiny" text-anchor="middle">S9 / MCP03</text>
  <rect x="865" y="250" width="140" height="58" rx="10" fill="#fff" stroke="#9ed0c4"/><text x="935" y="275" class="label" text-anchor="middle">Policy + scope</text><text x="935" y="295" class="tiny" text-anchor="middle">S4 / MCP02</text>
  <rect x="1020" y="250" width="120" height="58" rx="10" fill="#fff" stroke="#9ed0c4"/><text x="1080" y="275" class="label" text-anchor="middle">Egress</text><text x="1080" y="295" class="tiny" text-anchor="middle">S8 / SSRF</text>

  <rect x="710" y="328" width="140" height="58" rx="10" fill="#fff" stroke="#9ed0c4"/><text x="780" y="353" class="label" text-anchor="middle">Screening</text><text x="780" y="373" class="tiny" text-anchor="middle">S12 / MCP06</text>
  <rect x="865" y="328" width="140" height="58" rx="10" fill="#fff" stroke="#9ed0c4"/><text x="935" y="353" class="label" text-anchor="middle">Approval</text><text x="935" y="373" class="tiny" text-anchor="middle">S5 / SoD</text>
  <rect x="1020" y="328" width="120" height="58" rx="10" fill="#fff" stroke="#9ed0c4"/><text x="1080" y="353" class="label" text-anchor="middle">Receipt</text><text x="1080" y="373" class="tiny" text-anchor="middle">S6 / VRP</text>

  <rect x="710" y="406" width="210" height="58" rx="10" fill="#fff" stroke="#9ed0c4"/><text x="815" y="431" class="label" text-anchor="middle">ALLOW_INTENT journal</text><text x="815" y="451" class="tiny" text-anchor="middle">S7 / MCP08</text>
  <rect x="940" y="406" width="200" height="58" rx="10" fill="#0b5d62"/><text x="1040" y="431" style="font:750 13px 'Segoe UI',Arial;fill:#fff" text-anchor="middle">Then resolve credentials</text><text x="1040" y="451" style="font:700 11px 'Segoe UI',Arial;fill:#d6f1ee" text-anchor="middle">S3 | never forward caller token</text>

  <rect x="710" y="486" width="430" height="78" rx="12" fill="#fff" stroke="#9ed0c4"/>
  <text x="925" y="516" class="label" text-anchor="middle">Output bounds | redaction | no sampling/elicitation</text>
  <text x="925" y="540" class="tiny" text-anchor="middle">S11 | S15 | MCP01 | MCP10 at the gateway boundary</text>

  <path d="M1165 380 H1210" class="safe"/>

  <!-- Backend -->
  <g filter="url(#shadow)">
    <rect x="1210" y="250" width="230" height="260" rx="18" fill="#fff" stroke="#a8cad4"/>
  </g>
  <text x="1325" y="290" class="heading" text-anchor="middle">Backend</text>
  <text x="1325" y="318" class="body" text-anchor="middle">HTTP | MCP | plugin</text>
  <rect x="1235" y="345" width="180" height="44" rx="10" fill="#eef7fa"/><text x="1325" y="372" class="tiny" text-anchor="middle">Service / exchanged token</text>
  <rect x="1235" y="405" width="180" height="44" rx="10" fill="#eef7fa"/><text x="1325" y="432" class="tiny" text-anchor="middle">Engine ACLs still apply</text>
  <text x="1325" y="480" class="tiny" text-anchor="middle">Sandboxing is residual</text>

  <!-- Bypass risk -->
  <path d="M190 420 V620 H1210 V510" class="risk"/>
  <text x="700" y="610" style="font:750 12px 'Segoe UI',Arial;fill:#bd5447" text-anchor="middle">TM07 shadow MCP outside Aegis - network / inventory ownership (MCP09 external)</text>

  <!-- STRIDE panel -->
  <text x="58" y="660" class="eyebrow">STRIDE AT THE GATEWAY BOUNDARY</text>
  <g filter="url(#shadow)">
    <rect x="40" y="678" width="1400" height="210" rx="18" fill="#fff" stroke="#b8d5dd"/>
  </g>
  <g>
    <rect x="60" y="700" width="220" height="78" rx="12" fill="#eef7fa"/><text x="170" y="730" class="stride" text-anchor="middle">S | Spoofing</text><text x="170" y="754" class="tiny" text-anchor="middle">JWT / Knox / SPIFFE | S1 S2 S26</text>
    <rect x="300" y="700" width="220" height="78" rx="12" fill="#eef7fa"/><text x="410" y="730" class="stride" text-anchor="middle">T | Tampering</text><text x="410" y="754" class="tiny" text-anchor="middle">Pins | binding | audit | S9 S10 S7</text>
    <rect x="540" y="700" width="220" height="78" rx="12" fill="#eef7fa"/><text x="650" y="730" class="stride" text-anchor="middle">R | Repudiation</text><text x="650" y="754" class="tiny" text-anchor="middle">Intent-first journal | S5 S7 S28</text>
    <rect x="780" y="700" width="220" height="78" rx="12" fill="#eef7fa"/><text x="890" y="730" class="stride" text-anchor="middle">I | Disclosure</text><text x="890" y="754" class="tiny" text-anchor="middle">No passthrough | redact | S3 S11</text>
    <rect x="1020" y="700" width="200" height="78" rx="12" fill="#eef7fa"/><text x="1120" y="730" class="stride" text-anchor="middle">D | Denial</text><text x="1120" y="754" class="tiny" text-anchor="middle">Rates | bounds | breakers</text>
    <rect x="1240" y="700" width="180" height="78" rx="12" fill="#eef7fa"/><text x="1330" y="730" class="stride" text-anchor="middle">E | Elevation</text><text x="1330" y="754" class="tiny" text-anchor="middle">SoD | egress | class</text>
  </g>
  <rect x="60" y="798" width="1360" height="68" rx="12" fill="#edf6f8" stroke="#b8d5dd"/>
  <text x="740" y="828" style="font:700 13px 'Segoe UI',Arial;fill:#285465" text-anchor="middle">Aegis handles every OWASP MCP Top 10 item that crosses this gateway. Strong / partial / limited / external coverage is listed below - residual duties stay with IdP, network, backend, and operators.</text>
  <text x="740" y="852" style="font:700 12px 'Segoe UI',Arial;fill:#5a7380" text-anchor="middle">See SECURITY.md S1-S31 tests and evidence/SECURITY-VALIDATION.md for the control suite.</text>
</svg>
