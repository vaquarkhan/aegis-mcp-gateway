<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">Aegis Gateway 2.0 architecture</title>
  <desc id="description">Two separate host adapters, Apache Knox and the Aegis own host, normalize authenticated callers into one shared Aegis MCP protocol and governance plane. The shared plane applies policy, approval, receipts, egress and output controls before approved backend sources, while protected state and a hash-chained journal retain governance evidence.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d33"/>
      <stop offset="1" stop-color="#0b536c"/>
    </linearGradient>
    <linearGradient id="shared" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f8fc"/>
      <stop offset="1" stop-color="#f7fcff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0b2940" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,1 L11,6 L0,11 Z" fill="#297793"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,1 L11,6 L0,11 Z" fill="#16806e"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 750; fill: #ffffff; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #c9e7f1; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1.5px; fill: #32728a; }
      .section { font-size: 23px; font-weight: 750; fill: #0b2b43; }
      .label { font-size: 17px; font-weight: 700; fill: #102f45; }
      .body { font-size: 14px; font-weight: 400; fill: #38576a; }
      .small { font-size: 12px; font-weight: 650; fill: #456879; }
      .number { font-size: 13px; font-weight: 800; fill: #ffffff; }
      .white { fill: #ffffff; }
      .line { fill: none; stroke: #297793; stroke-width: 3; marker-end: url(#arrow); }
      .greenLine { fill: none; stroke: #16806e; stroke-width: 3; marker-end: url(#arrowGreen); }
      .dash { fill: none; stroke: #74a5b6; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f4f9fc"/>
  <rect x="26" y="24" width="1548" height="112" rx="24" fill="url(#header)"/>
  <text x="66" y="73" class="title">Aegis Gateway 2.0</text>
  <text x="66" y="105" class="subtitle">Two host integrations. One shared MCP governance plane. Clear deployment boundaries.</text>
  <rect x="1257" y="56" width="270" height="42" rx="21" fill="#113f58" stroke="#6fd4df"/>
  <circle cx="1284" cy="77" r="8" fill="#66dfbd"/>
  <text x="1302" y="82" style="font:700 14px 'Segoe UI',Arial;fill:#eafff9">FAIL-CLOSED BY DESIGN</text>

  <!-- Connection paths sit behind cards. -->
  <path d="M274 326 H310 V262 H347" class="line"/>
  <path d="M310 326 V452 H347" class="line"/>
  <path d="M695 262 H738" class="line"/>
  <path d="M695 452 H716 V309 H738" class="line"/>
  <path d="M1130 617 V673" class="greenLine"/>
  <path d="M915 617 V653 H350 V690" class="dash"/>
  <path d="M1040 617 V653 H594 V690" class="dash"/>

  <!-- Client -->
  <text x="50" y="180" class="eyebrow">CALLER BOUNDARY</text>
  <g filter="url(#shadow)">
    <rect x="50" y="205" width="224" height="242" rx="20" fill="#ffffff" stroke="#bdd4df"/>
  </g>
  <circle cx="162" cy="262" r="34" fill="#dff2f8" stroke="#5ca6bf"/>
  <path d="M148 263 h28 M162 249 v28" stroke="#176d8a" stroke-width="4" stroke-linecap="round"/>
  <text x="162" y="321" class="section" text-anchor="middle">MCP client</text>
  <text x="162" y="350" class="body" text-anchor="middle">Agent, IDE, service</text>
  <rect x="78" y="374" width="168" height="42" rx="10" fill="#eef7fb"/>
  <text x="162" y="400" class="small" text-anchor="middle">HTTP or local stdio</text>

  <!-- Host adapters -->
  <text x="347" y="180" class="eyebrow">HOST-SPECIFIC ADMISSION</text>
  <g filter="url(#shadow)">
    <rect x="347" y="205" width="348" height="130" rx="18" fill="#ffffff" stroke="#5da2bb" stroke-width="2"/>
    <rect x="347" y="205" width="9" height="130" rx="4" fill="#0a7593"/>
    <text x="380" y="240" class="label">Aegis own-host adapter</text>
    <text x="380" y="269" class="body">TLS, JWT/JWKS, OAuth metadata</text>
    <text x="380" y="292" class="body">Route groups, scopes, exact CORS</text>
    <text x="380" y="316" class="small">aegis-gateway + aegis-mcp-security</text>

    <rect x="347" y="389" width="348" height="130" rx="18" fill="#ffffff" stroke="#826ab4" stroke-width="2"/>
    <rect x="347" y="389" width="9" height="130" rx="4" fill="#6a4ca5"/>
    <text x="380" y="424" class="label">Apache Knox host adapter</text>
    <text x="380" y="453" class="body">Knox TLS, authentication, identity, ACL</text>
    <text x="380" y="476" class="body">Subject becomes Aegis CallerIdentity</text>
    <text x="380" y="500" class="small">service adapter using documented Knox APIs</text>
  </g>
  <rect x="378" y="545" width="286" height="38" rx="19" fill="#f3effb" stroke="#b6a6d8"/>
  <text x="521" y="569" style="font:700 12px 'Segoe UI',Arial;fill:#5a438f" text-anchor="middle">HOST INTEGRATIONS SHARE THE GOVERNANCE CORE</text>

  <!-- Shared governance plane -->
  <text x="738" y="180" class="eyebrow">SHARED AEGIS IMPLEMENTATION</text>
  <g filter="url(#shadow)">
    <rect x="738" y="205" width="812" height="412" rx="22" fill="url(#shared)" stroke="#54a9bd" stroke-width="2"/>
  </g>
  <rect x="770" y="232" width="748" height="70" rx="15" fill="#0c4f69"/>
  <text x="800" y="261" style="font:700 18px 'Segoe UI',Arial;fill:#ffffff">MCP protocol and canonical action</text>
  <text x="800" y="286" style="font:400 14px 'Segoe UI',Arial;fill:#cdebf3">2025 stateful eras + 2026-07-28 stateless | tools, resources, prompts, completion</text>

  <text x="770" y="337" class="section">Fixed governance order</text>
  <g>
    <rect x="770" y="357" width="225" height="54" rx="12" fill="#ffffff" stroke="#a7cbd8"/>
    <circle cx="796" cy="384" r="15" fill="#177a96"/><text x="796" y="389" class="number" text-anchor="middle">1</text>
    <text x="820" y="380" class="small">EXPOSURE + INPUT</text><text x="820" y="397" class="body">schema and typed scope</text>
    <rect x="1010" y="357" width="225" height="54" rx="12" fill="#ffffff" stroke="#a7cbd8"/>
    <circle cx="1036" cy="384" r="15" fill="#177a96"/><text x="1036" y="389" class="number" text-anchor="middle">2</text>
    <text x="1060" y="380" class="small">POLICY + EGRESS</text><text x="1060" y="397" class="body">default deny, target checks</text>
    <rect x="1250" y="357" width="268" height="54" rx="12" fill="#ffffff" stroke="#a7cbd8"/>
    <circle cx="1276" cy="384" r="15" fill="#177a96"/><text x="1276" y="389" class="number" text-anchor="middle">3</text>
    <text x="1300" y="380" class="small">LIMITS + SCREENING</text><text x="1300" y="397" class="body">rate, breaker, hooks</text>

    <rect x="770" y="427" width="225" height="54" rx="12" fill="#ffffff" stroke="#92cbbd"/>
    <circle cx="796" cy="454" r="15" fill="#16806e"/><text x="796" y="459" class="number" text-anchor="middle">4</text>
    <text x="820" y="450" class="small">PREVIEW + RECEIPT</text><text x="820" y="467" class="body">destructive validation</text>
    <rect x="1010" y="427" width="225" height="54" rx="12" fill="#ffffff" stroke="#92cbbd"/>
    <circle cx="1036" cy="454" r="15" fill="#16806e"/><text x="1036" y="459" class="number" text-anchor="middle">5</text>
    <text x="1060" y="450" class="small">INDEPENDENT APPROVAL</text><text x="1060" y="467" class="body">evidence, no self-approval</text>
    <rect x="1250" y="427" width="268" height="54" rx="12" fill="#ffffff" stroke="#92cbbd"/>
    <circle cx="1276" cy="454" r="15" fill="#16806e"/><text x="1276" y="459" class="number" text-anchor="middle">6</text>
    <text x="1300" y="450" class="small">COMMIT + EXECUTE</text><text x="1300" y="467" class="body">journal first, credential last</text>
  </g>
  <rect x="770" y="508" width="748" height="76" rx="14" fill="#fff8e9" stroke="#dfb85a"/>
  <text x="794" y="535" style="font:750 13px 'Segoe UI',Arial;fill:#835400">ACTION BINDING</text>
  <text x="794" y="560" class="body">caller + gateway + tool + class + source + resources + argument digest + pinned definition digest</text>
  <text x="794" y="579" class="small">Approval and dry-run receipts cannot move across callers, gateways or definition changes.</text>

  <!-- Evidence and state -->
  <text x="50" y="670" class="eyebrow">PROTECTED EVIDENCE AND STATE</text>
  <g filter="url(#shadow)">
    <rect x="50" y="690" width="314" height="205" rx="20" fill="#ffffff" stroke="#87b7c7"/>
    <text x="78" y="731" class="label">Hash-chained journal</text>
    <text x="78" y="761" class="body">Intent before execution</text>
    <text x="78" y="784" class="body">Decision and result evidence</text>
    <text x="78" y="807" class="body">Offline chain verification</text>
    <rect x="78" y="834" width="252" height="34" rx="9" fill="#e9f7f3"/>
    <text x="204" y="856" class="small" text-anchor="middle">journal failure means no execution</text>

    <rect x="388" y="690" width="314" height="205" rx="20" fill="#ffffff" stroke="#87b7c7"/>
    <text x="416" y="731" class="label">Governance state</text>
    <text x="416" y="761" class="body">Single-use approval and receipt</text>
    <text x="416" y="784" class="body">Budgets, rate windows and pins</text>
    <text x="416" y="807" class="body">Memory or durable local Derby</text>
    <rect x="416" y="834" width="252" height="34" rx="9" fill="#eef5fb"/>
    <text x="542" y="856" class="small" text-anchor="middle">shared provider required for replicas</text>
  </g>

  <!-- Sources -->
  <text x="738" y="670" class="eyebrow">APPROVED BACKEND SOURCES</text>
  <g filter="url(#shadow)">
    <rect x="738" y="690" width="812" height="205" rx="20" fill="#ffffff" stroke="#87b7c7"/>
  </g>
  <g>
    <rect x="770" y="726" width="168" height="116" rx="16" fill="#eef8fb" stroke="#9fc7d5"/>
    <text x="854" y="764" class="label" text-anchor="middle">MCP</text>
    <text x="854" y="790" class="body" text-anchor="middle">HTTP or stdio</text>
    <text x="854" y="816" class="small" text-anchor="middle">proxied after policy</text>

    <rect x="955" y="726" width="168" height="116" rx="16" fill="#eef8fb" stroke="#9fc7d5"/>
    <text x="1039" y="764" class="label" text-anchor="middle">REST</text>
    <text x="1039" y="790" class="body" text-anchor="middle">typed templates</text>
    <text x="1039" y="816" class="small" text-anchor="middle">no caller token</text>

    <rect x="1140" y="726" width="168" height="116" rx="16" fill="#eef8fb" stroke="#9fc7d5"/>
    <text x="1224" y="764" class="label" text-anchor="middle">Converters</text>
    <text x="1224" y="790" class="body" text-anchor="middle">JDBC, ZooKeeper</text>
    <text x="1224" y="816" class="small" text-anchor="middle">real protocol clients</text>

    <rect x="1325" y="726" width="193" height="116" rx="16" fill="#eef8fb" stroke="#9fc7d5"/>
    <text x="1421" y="764" class="label" text-anchor="middle">Typed plugins</text>
    <text x="1421" y="790" class="body" text-anchor="middle">Kafka, Spark Connect</text>
    <text x="1421" y="816" class="small" text-anchor="middle">source-specific controls</text>
  </g>

  <text x="50" y="946" class="small">Trust rule: host admission establishes identity. Aegis then governs the exact MCP action. The backend is called only after commit.</text>
</svg>
