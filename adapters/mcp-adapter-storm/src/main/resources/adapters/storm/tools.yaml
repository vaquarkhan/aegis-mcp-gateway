engine: storm
taxonomyClass: streaming
tools:
  - name: cluster_summary
    class: READ
    description: Storm cluster summary
    inputSchema: '{"type":"object","properties":{}}'
  - name: list_topologies
    class: READ
    description: List Storm topologies
    inputSchema: '{"type":"object","properties":{}}'
  - name: get_topology
    class: READ
    description: Get Storm topology details
    inputSchema: '{"type":"object","properties":{"id":{"type":"string"}},"required":["id"]}'
  - name: kill_topology
    class: DESTRUCTIVE
    description: Kill a Storm topology
    inputSchema: '{"type":"object","properties":{"id":{"type":"string"},"approvalToken":{"type":"string"}},"required":["id","approvalToken"]}'
