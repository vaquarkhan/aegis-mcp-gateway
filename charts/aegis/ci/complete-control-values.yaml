image:
  repository: registry.example/aegis
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
runtimeClassName: gvisor
networkPolicy:
  enabled: true
  ingressFrom:
    - podSelector: {matchLabels: {app.kubernetes.io/name: mcp-client}}
  egressTo:
    - namespaceSelector: {matchLabels: {aegis-managed-backend: "true"}}
config:
  completeControl: {enabled: true}
  gateway: {name: aegis-complete}
  access: {}
  policy:
    rules:
      - {id: read, groups: [analysts], classes: [READ]}
  catalog: {mode: REQUIRE_PINS}
  egress: {allowCidrs: [10.0.0.0/8]}
  audit: {file: /var/lib/aegis/audit/aegis.jsonl}
  sources:
    - id: catalog
      type: http
      baseUrl: https://catalog.data.svc:8181
      unlistedTools: HIDE
      strictProperties: true
      deploymentAttestation:
        subjectDigest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        evidenceDigest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        verifier: cluster-admission.example/verifier
        validUntil: "2026-11-30T00:00:00Z"
      tools:
        - name: list_namespaces
          description: List catalog namespaces.
          class: READ
          inputSchema: {type: object, properties: {}, additionalProperties: false}
          executionContract: {kind: TYPED_OPERATION, operationId: catalog.listNamespaces}
          outputPolicy: {mode: HANDLE_ONLY}
          request: {method: GET, path: /v1/namespaces}
  host:
    listen: {host: 0.0.0.0, port: 8080, allowPlaintext: true}
    identity:
      type: jwt
      jwt:
        issuer: https://idp.example.com/realms/acme
        audience: aegis-gateway
        jwksUri: https://idp.example.com/realms/acme/protocol/openid-connect/certs
