{{- include "aegis.validate" . -}}
{{- if not .Values.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  aegis.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
{{- end }}
