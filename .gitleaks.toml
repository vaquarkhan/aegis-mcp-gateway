# Retained historical Airflow transcripts contain synthetic test values. They are
# evidence records and must remain byte-for-byte intact; this narrow allowlist
# excludes only those two reviewed files from generic-api-key detection.
[allowlist]
paths = [
  '''^examples/adopters/airflow/results/knox-transcript\.log$''',
  '''^examples/adopters/airflow/results/own-host-transcript\.log$'''
]
